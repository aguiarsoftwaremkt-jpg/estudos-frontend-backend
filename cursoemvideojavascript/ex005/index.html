<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usando moedas</title>
</head>
<body>
    <h1>Moedas</h1>
    <script>
        var n1 = 1690
        alert(n1.toLocaleString('pt-br', {style:'currency', currency: 'BRL'}))
        alert(n1.toLocaleString('pt-br', {style:'currency', currency: 'USD'}))
        alert(n1.toLocaleString('pt-br', {style:'currency', currency: 'EUR'}))
    </script>
</body>
</html>
