<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <P>Abra o site em vários dispositivos diferentes.</P>
    <picture>
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>
    <h1>Áudios:</h1>
    <p>Aprendendo a reproduzir áudios em html5</p>
    <audio src="midia/audiowpp.ogg" controls autoplay></audio>
    <audio>
        <source src="midia/audiowpp.ogg" type="audio/ogg">
    </audio>
</body>
</html>
