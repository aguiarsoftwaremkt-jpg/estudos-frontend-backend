<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Prágrafos e quebras de linha</h1>
    <hr>
    <p>Você pode escrever de qualquer jeito, mas você só pode quebrar linhas com a tag - "br" <br> Ou com outra tag "p" mas você pula paragrafo e não quebra linha...<br>
    para usar as o sinal maior que ou menor que como texto, basta usar o seguinte comando: <br> &lt;p&gt; &lt;/p&gt;
    </p>
</body>
